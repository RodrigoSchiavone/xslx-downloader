name: Build Executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Browsers
      run: |
        $env:PLAYWRIGHT_BROWSERS_PATH="0"
        python -m playwright install chromium

    - name: Build Executable with PyInstaller
      run: |
        $PLAYWRIGHT_PATH = (python -c "import os, playwright; print(os.path.join(os.path.dirname(playwright.__file__), 'driver', 'package', '.local-browsers'))")
        pyinstaller --onefile  --add-data "$PLAYWRIGHT_PATH;playwright/driver/package/.local-browsers" --name "DownloaderSharePoint" main.py

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DownloaderSharePoint-Windows
        path: dist/DownloaderSharePoint.exe